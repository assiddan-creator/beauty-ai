name: migrate-custom-request

on:
  push:
    branches:
      - custom-request-ux

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: custom-request-ux
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migration
        run: node scripts/migrate-custom-request.mjs

      - name: Verify production build
        run: npm run build

      - name: Remove one-time migration files
        run: |
          rm scripts/migrate-custom-request.mjs
          rm .github/workflows/migrate-custom-request.yml

      - name: Commit migrated app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git commit -m "ui: make free-form makeup requests explicit"
          git push origin HEAD:custom-request-ux
