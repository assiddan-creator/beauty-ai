name: migrate-specific-product-flow

on:
  push:
    branches:
      - migrate-specific-product-flow

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: migrate-specific-product-flow
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migration
        run: node scripts/migrate-specific-product-flow.mjs

      - name: Verify production build
        run: npm run build

      - name: Commit migrated app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git rm scripts/migrate-specific-product-flow.mjs .github/workflows/migrate-specific-product-flow.yml
          git commit -m "refactor: connect specific product flow to unified catalog"
          git push origin HEAD:migrate-specific-product-flow
