name: Cloudflare migration check

on:
  push:
    branches:
      - cloudflare-migration
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Compile Cloudflare Worker without deploying
        run: npx --yes wrangler@latest deploy --dry-run --outdir .wrangler-dry-run
