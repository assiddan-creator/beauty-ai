name: fix-analysis-completion

on:
  push:
    branches:
      - custom-request-ux

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: custom-request-ux
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Apply fix
        run: node scripts/fix-analysis-completion.cjs

      - name: Verify production build
        run: npm run build

      - name: Remove one-time files
        run: rm scripts/fix-analysis-completion.cjs .github/workflows/fix-analysis-completion.yml

      - name: Commit fixed app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx scripts/fix-analysis-completion.cjs .github/workflows/fix-analysis-completion.yml
          git commit -m "fix: stop analysis loader when results are ready"
          git push origin HEAD:custom-request-ux
